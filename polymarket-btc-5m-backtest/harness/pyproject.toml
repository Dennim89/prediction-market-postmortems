[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pm-5m-backtest-checks"
version = "0.1.0"
description = "Taker backtest harness for 5-minute up/down markets with a friction model, sanity controls, a lookahead check and a per-day split."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Denys" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["backtest_checks*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
